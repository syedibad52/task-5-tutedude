# ============================================================
# Docker Compose Configuration — Full Stack App
# ============================================================
# This file defines two services:
#   1. frontend  — Node.js + Express (port 3000)
#   2. backend   — Python + Flask   (port 5000)
#
# Both services share a custom bridge network (app-network)
# so they can communicate using service names as hostnames.
# ============================================================

services:

  # ──────────────────────────────────────────
  # Frontend Service (Node.js + Express)
  # ──────────────────────────────────────────
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"                        # Host:Container port mapping
    environment:
      # The frontend uses this URL to reach the Flask backend.
      # "backend" resolves to the backend container's IP via Docker DNS.
      - BACKEND_URL=http://backend:5000
    depends_on:
      backend:
        condition: service_healthy          # Wait for backend to be healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ──────────────────────────────────────────
  # Backend Service (Python + Flask)
  # ──────────────────────────────────────────
  backend:
    build: ./backend
    ports:
      - "5000:5000"                        # Host:Container port mapping
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# ──────────────────────────────────────────
# Networks
# ──────────────────────────────────────────
# Custom bridge network — containers can reach each other
# using their service names (e.g., "backend", "frontend")
# instead of IP addresses.
networks:
  app-network:
    driver: bridge
